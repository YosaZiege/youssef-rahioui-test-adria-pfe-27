spring.application.name=chatbot-service
server.port=8093
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.accounts.url=${BANK_ACCOUNT_MCP_URL:http://localhost:8091}
spring.ai.mcp.client.streamable-http.connections.transactions.url=${BANK_TRANSACTION_MCP_URL:http://localhost:8092}
